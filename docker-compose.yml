name: stock-tracker

x-app: &app
  build: .
  image: stock-tracker-app:latest
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy
  environment: &app-env
    KAFKA_BROKERS: kafka:9092
    SYMBOLS: ${SYMBOLS:-}
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper).
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092" # for running the Node services on your host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  price-producer:
    <<: *app
    command: ["node", "src/producer/index.js"]
    environment:
      <<: *app-env
      DATA_SOURCE: ${DATA_SOURCE:-simulated}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      TICK_INTERVAL_MS: ${TICK_INTERVAL_MS:-1000}

  alert-engine:
    <<: *app
    command: ["node", "src/alerts/index.js"]
    environment:
      <<: *app-env
      ALERT_COOLDOWN_MS: ${ALERT_COOLDOWN_MS:-30000}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

  gateway:
    <<: *app
    command: ["node", "src/gateway/index.js"]
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional web UI for inspecting topics: docker compose --profile tools up -d
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  kafka-data:
